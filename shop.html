<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.gstatic.com; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://*.firebaseapp.com wss://*.firebaseio.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Shop · Price Keeper</title>
<meta name="description" content="Browse products and order on WhatsApp.">
<style>
  :root{
    --bg:#0A0A0A; --s1:#141414; --s2:#1A1A1A; --s3:#222; --border:#222; --border2:#333;
    --accent:#D4A537; --text:#F5F5F5; --text2:#E8E8E8; --muted:#888; --dim:#555;
    --green:#5DCAA5; --amber:#EF9F27; --wa:#25D366; --red:#F09595;
    --fb:'Inter',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{font-family:var(--fb);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;
    max-width:520px;margin:0 auto;min-height:100%;position:relative;}
  .wrap{padding-bottom:96px;}

  .head{padding:18px 16px 15px;background:linear-gradient(180deg,rgba(212,165,55,.10),transparent);border-bottom:1px solid var(--border);}
  .shop{font-size:21px;font-weight:600;letter-spacing:.01em;}
  .meta{font-size:12px;color:var(--muted);margin-top:4px;display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
  .open{color:var(--green);} .closed{color:var(--amber);} .sep{color:var(--dim);}

  .search{margin:13px 16px 6px;display:flex;align-items:center;gap:8px;background:var(--s1);border:1px solid var(--border2);border-radius:10px;padding:10px 12px;}
  .search input{flex:1;background:none;border:none;outline:none;color:var(--text);font:inherit;font-size:14px;}
  .search .ic{color:var(--muted);}
  .search .clear{display:flex;align-items:center;justify-content:center;flex-shrink:0;width:20px;height:20px;background:none;border:none;border-radius:50%;color:var(--red);font-size:12px;line-height:1;cursor:pointer;padding:0;}
  .search .clear:hover{background:rgba(240,149,149,.14);}
  .search .clear[hidden]{display:none;}

  .list{padding:4px 12px;}
  .prod{display:flex;align-items:center;gap:12px;padding:13px 8px;border-bottom:1px solid var(--s1);}
  .prod.out{opacity:.5;}
  .info{flex:1;min-width:0;}
  .name{font-size:14.5px;font-weight:500;}
  .price{font-size:12.5px;color:var(--accent);margin-top:3px;font-variant-numeric:tabular-nums;}
  .price .alt{color:var(--muted);}
  .badge{font-size:10.5px;margin-top:4px;}
  .b-in{color:var(--green);} .b-low{color:var(--amber);} .b-out{color:var(--muted);}
  .add button{background:var(--accent);color:#0A0A0A;border:none;border-radius:8px;font:inherit;font-weight:600;font-size:12.5px;padding:8px 13px;cursor:pointer;}
  .stepper{display:none;align-items:center;gap:9px;}
  .stepper.on{display:flex;}
  .stepper button{width:28px;height:28px;border-radius:8px;border:1px solid var(--border2);background:var(--s2);color:var(--text);font-size:16px;cursor:pointer;line-height:1;}
  .stepper .q{min-width:18px;text-align:center;font-variant-numeric:tabular-nums;font-size:14px;}

  .bar{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;padding:12px 14px calc(12px + env(safe-area-inset-bottom));
    background:var(--s1);border-top:1px solid var(--border2);display:flex;align-items:center;gap:10px;}
  .bar.hide{display:none;}
  .bar .sum{flex:1;font-size:12.5px;color:var(--muted);}
  .bar .sum b{color:var(--text);}
  .bar .order{background:var(--wa);color:#04210f;border:none;border-radius:11px;font:inherit;font-weight:700;font-size:14px;padding:12px 18px;cursor:pointer;}
  .bar .order:disabled{opacity:.5;cursor:not-allowed;}

  .state{padding:60px 28px;text-align:center;color:var(--muted);}
  .state .big{font-size:34px;margin-bottom:14px;}
  .state h2{font-size:16px;font-weight:500;color:var(--text2);margin-bottom:6px;}
  .state p{font-size:13px;line-height:1.5;}

  .foot{text-align:center;font-size:11px;color:var(--dim);padding:18px 14px 8px;}
  .foot a{color:var(--accent);text-decoration:none;}
  .skel{padding:40px 16px;color:var(--dim);text-align:center;font-size:13px;}
</style>
</head>
<body>
  <div id="app" class="wrap"><div class="skel">Loading shop…</div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyA9TNeVrXMwP7irTeR1UkqvLQcFXmmabag",
  authDomain: "pricekeeper-demo-2.firebaseapp.com",
  projectId: "pricekeeper-demo-2",
  storageBucket: "pricekeeper-demo-2.firebasestorage.app",
  messagingSenderId: "1078259047859",
  appId: "1:1078259047859:web:4ff251940cc9ab97c5ffc6"
};
const db = getFirestore(initializeApp(firebaseConfig));

const app = document.getElementById('app');
const params = new URLSearchParams(location.search);
// Resolve the shop: clean path /shop/<slug>, or ?s=<slug>, or legacy ?u=<uid>.
async function resolveUid(){
  const m = location.pathname.match(/\/shop\/([^/?#]+)/);
  const slug = m ? decodeURIComponent(m[1]) : params.get('s');
  if (slug) {
    const snap = await getDoc(doc(db, 'storefronts', slug.toLowerCase()));
    return snap.exists() ? (snap.data().uid || null) : null;
  }
  return params.get('u');
}
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => Math.round(n).toLocaleString('en-NG');

// Nigeria-friendly phone normalisation for wa.me (no '+').
function waPhone(raw){
  let d = String(raw || '').replace(/\D/g, '');
  if (!d) return '';
  if (d.startsWith('234')) return d;
  if (d.startsWith('0'))   return '234' + d.slice(1);
  if (d.length === 10)     return '234' + d;     // e.g. 803XXXXXXX
  return d;
}

function stateView(big, title, msg){
  app.innerHTML = `<div class="state"><div class="big">${big}</div><h2>${esc(title)}</h2><p>${esc(msg)}</p></div>
    <div class="foot">Powered by <a href="https://pricekeeper.netlify.app" target="_blank" rel="noopener">Price Keeper</a></div>`;
}

let DATA = null, PHONE = '', order = {};

function badge(state){
  return state === 'out' ? '<span class="badge b-out">Sold out</span>'
       : state === 'low' ? '<span class="badge b-low">⚠ Low stock</span>'
       : '<span class="badge b-in">✅ In stock</span>';
}

function render(filter=''){
  // The whole page is rebuilt, search box included, so remember whether the
  // customer was typing in it. Otherwise the phone keyboard closes per letter.
  const typing = document.activeElement && document.activeElement.id === 'q';
  const f = (filter||'').trim().toLowerCase();
  const shop = DATA.shop || {};
  const products = (DATA.products || []).filter(p => !f || (p.name||'').toLowerCase().includes(f));
  const rows = products.map((p) => {
    const i = (DATA.products || []).indexOf(p);
    const price = `₦${fmt(p.pc)} / pc`
      + (p.row ? ` <span class="alt">· ₦${fmt(p.row)} / row</span>` : '')
      + (p.ctn ? ` <span class="alt">· ₦${fmt(p.ctn)} / ${esc(p.ctnLabel||'carton')}</span>` : '');
    const q = order[i] || 0;
    const ctrl = p.state === 'out'
      ? '<span style="font-size:11px;color:var(--muted);">—</span>'
      : `<div class="add">
           <button data-add="${i}" style="${q?'display:none':''}">＋ Add</button>
           <div class="stepper ${q?'on':''}"><button data-dec="${i}">−</button><span class="q">${q}</span><button data-add="${i}">＋</button></div>
         </div>`;
    return `<div class="prod ${p.state==='out'?'out':''}">
      <div class="info"><div class="name">${esc(p.name)}</div><div class="price">${price}</div>${badge(p.state)}</div>${ctrl}</div>`;
  }).join('') || `<div class="skel">No items match your search.</div>`;

  app.innerHTML = `
    <div class="head">
      <div class="shop">${esc(shop.name || 'Shop')}</div>
      <div class="meta"><span class="open">● Open</span>${shop.location?`<span class="sep">·</span><span>${esc(shop.location)}</span>`:''}<span class="sep">·</span><span>Tap items to order</span></div>
    </div>
    <div class="search"><span class="ic">⌕</span><input id="q" placeholder="Search products…" autocomplete="off"><button type="button" class="clear" id="qClear" aria-label="Clear search" ${filter?'':'hidden'}>✕</button></div>
    <div class="list" id="list">${rows}</div>
    <div class="foot">🔒 Prices set by the shop · Powered by <a href="https://pricekeeper.netlify.app" target="_blank" rel="noopener">Price Keeper</a></div>
    <div class="bar hide" id="bar">
      <div class="sum"><b id="oc">0 items</b> · ₦<span id="ot">0</span></div>
      <button class="order" id="ob" ${PHONE?'':'disabled title="Shop has no WhatsApp number"'}>🟢 Order on WhatsApp</button>
    </div>`;

  const qEl = document.getElementById('q');
  qEl.value = filter;
  if (typing) { qEl.focus(); qEl.setSelectionRange(filter.length, filter.length); }
  document.getElementById('q').addEventListener('input', e => render(e.target.value));
  document.getElementById('qClear').addEventListener('click', () => render(''));
  document.getElementById('list').addEventListener('click', e => {
    const a = e.target.closest('[data-add]'); const d = e.target.closest('[data-dec]');
    if (a) { const i=+a.dataset.add; order[i]=(order[i]||0)+1; sync(filter); }
    if (d) { const i=+d.dataset.dec; order[i]=Math.max(0,(order[i]||0)-1); if(!order[i])delete order[i]; sync(filter); }
  });
  const ob = document.getElementById('ob'); if (ob) ob.addEventListener('click', sendOrder);
  sync(filter, true);
}

function sync(filter, skipRerender){
  if (!skipRerender) render(filter);
  let items=0, total=0;
  for (const k in order){ const p=DATA.products[k]; if(p){ items+=order[k]; total+=order[k]*p.pc; } }
  const oc=document.getElementById('oc'), ot=document.getElementById('ot'), bar=document.getElementById('bar');
  if (oc) oc.textContent = items+' item'+(items===1?'':'s');
  if (ot) ot.textContent = fmt(total);
  if (bar) bar.classList.toggle('hide', items===0);
}

function sendOrder(){
  if (!PHONE) return;
  const shop = DATA.shop || {};
  const lines = [`Hello ${shop.name||'shop'} 👋`, "I'd like to order:", ''];
  let total=0;
  for (const k in order){ const p=DATA.products[k]; if(p){ lines.push(`• ${order[k]} × ${p.name} — ₦${fmt(order[k]*p.pc)}`); total+=order[k]*p.pc; } }
  lines.push('', `Total: ₦${fmt(total)}`, '', 'Is this available?');
  location.href = `https://wa.me/${PHONE}?text=${encodeURIComponent(lines.join('\n'))}`;
}

(async () => {
  let uid;
  try { uid = await resolveUid(); }
  catch (e) { console.error(e); stateView('⚠️', 'Couldn’t load the shop', 'Please check your connection and try again.'); return; }
  if (!uid) { stateView('🔗', 'Shop not found', 'This storefront link doesn’t point to a shop. Ask the shop for an up-to-date link.'); return; }
  try {
    const snap = await getDoc(doc(db, 'shops', uid, 'public', 'storefront'));
    if (!snap.exists()) { stateView('🛍', 'Shop not set up yet', 'This shop hasn’t published its storefront. Check back soon.'); return; }
    DATA = snap.data();
    PHONE = waPhone(DATA.shop?.phone);
    if (DATA.live === false) { stateView('😴', `${DATA.shop?.name||'This shop'} is closed`, 'The shop isn’t taking orders right now. Please check back later.'); return; }
    if (!(DATA.products||[]).length) { stateView('📦', 'No items yet', 'This shop hasn’t listed any products yet.'); return; }
    render('');
  } catch (e) {
    console.error(e);
    stateView('⚠️', 'Couldn’t load the shop', 'Please check your connection and try again.');
  }
})();
</script>
</body>
</html>
